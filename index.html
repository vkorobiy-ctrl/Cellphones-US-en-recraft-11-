<!DOCTYPE html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone — choose a model</title>

<style>
/* ============================================================
   THEMES  (bottom dots switch these)
   ============================================================ */
:root{
  --accent:#FF9500;          /* View Details */
  --accent-ink:#231500;
  --green:#34C759;           /* Learn More */
  --green-ink:#08240F;
  --card-radius:24px;
  --panel-radius:20px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

html[data-theme="graphite"]{
  --bg:#191919; --card:#242424; --line:#343434;
  --text:#F2F2F2; --muted:#8E8E93;
  --chip:transparent; --chip-line:#3C3C3C;
  --sel:#F2F2F2; --sel-ink:#191919;
  --ring:rgba(255,255,255,.9); --badge:rgba(255,255,255,.08);
}
html[data-theme="blue"]{
  --bg:#132B4D; --card:#1B3A63; --line:#2C5081;
  --text:#EEF3FA; --muted:#94A9C4;
  --chip:transparent; --chip-line:#335A8C;
  --sel:#EEF3FA; --sel-ink:#132B4D;
  --ring:rgba(255,255,255,.9); --badge:rgba(255,255,255,.1);
}
html[data-theme="violet"]{
  --bg:#38204F; --card:#472B62; --line:#5C3C7C;
  --text:#F3EEF8; --muted:#B09EC5;
  --chip:transparent; --chip-line:#63428A;
  --sel:#F3EEF8; --sel-ink:#38204F;
  --ring:rgba(255,255,255,.9); --badge:rgba(255,255,255,.1);
}
html[data-theme="forest"]{
  --bg:#163F35; --card:#1E5245; --line:#2D6B59;
  --text:#EEF7F3; --muted:#95B9AD;
  --chip:transparent; --chip-line:#327560;
  --sel:#EEF7F3; --sel-ink:#163F35;
  --ring:rgba(255,255,255,.9); --badge:rgba(255,255,255,.1);
}
html[data-theme="burgundy"]{
  --bg:#532B37; --card:#683744; --line:#83485B;
  --text:#FAEEF1; --muted:#C79BA8;
  --chip:transparent; --chip-line:#8B4E62;
  --sel:#FAEEF1; --sel-ink:#532B37;
  --ring:rgba(255,255,255,.9); --badge:rgba(255,255,255,.1);
}
html[data-theme="cream"]{
  --bg:#F0EAE2; --card:#FFFFFF; --line:#E2DACD;
  --text:#1C1C1E; --muted:#787069;
  --chip:transparent; --chip-line:#DCD3C5;
  --sel:#1C1C1E; --sel-ink:#FFFFFF;
  --ring:rgba(0,0,0,.72); --badge:rgba(0,0,0,.05);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:var(--bg);transition:background-color 300ms var(--ease);}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color 300ms var(--ease),color 300ms var(--ease);
  min-height:100vh;
  overflow-x:hidden;
}
img{display:block;max-width:100%;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}

.shell{
  width:100%;
  max-width:460px;
  margin:0 auto;
  padding:0 15px;
}

/* ============================================================
   CATALOG HEAD
   ============================================================ */
.brand{padding:26px 0 18px;text-align:center;}
.brand .logo{
  width:26px;height:26px;margin:0 auto 14px;
  color:var(--text);
  transition:color 300ms var(--ease);
}
.lede{
  margin:0 auto;
  max-width:320px;
  font-size:14.5px;
  line-height:1.45;
  color:var(--muted);
  transition:color 300ms var(--ease);
}

/* ============================================================
   CATALOG CARDS
   ============================================================ */
.cards{display:flex;flex-direction:column;gap:15px;}

.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--card-radius);
  padding:21px;
  transition:background-color 300ms var(--ease),border-color 300ms var(--ease);
}
.badge{
  position:absolute;top:16px;right:16px;
  font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:5px 10px;border-radius:999px;
  background:var(--badge);
  border:1px solid var(--line);
  color:var(--muted);
}
.media{
  height:264px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.media img{
  width:100%;height:100%;
  object-fit:contain;
}
.model{
  margin:0 0 7px;
  font-size:19px;font-weight:600;letter-spacing:-.01em;
  text-align:left;
}
.colorline{
  margin:0 0 16px;
  display:flex;align-items:center;gap:8px;
  font-size:14px;color:var(--muted);
}
.swatch-dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);
  flex:none;
}

.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;
  border-radius:14px;
  font-size:16px;font-weight:600;
  transition:filter 140ms var(--ease),transform 140ms var(--ease);
}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:scale(.985);filter:brightness(.95);}
.btn-primary{height:48px;background:var(--accent);color:var(--accent-ink);}
.btn-learn{height:50px;background:var(--green);color:var(--green-ink);margin-top:18px;}

/* ============================================================
   DETAILS
   ============================================================ */
.detail-top{padding:14px 0 2px;}
.back{
  width:38px;height:38px;margin-left:-8px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--muted);
  transition:color 140ms var(--ease);
}
.back:hover{color:var(--text);}
.back svg{width:19px;height:19px;}

.hero{
  position:relative;
  height:198px;
  margin:4px 0 18px;
}
.hero img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  opacity:0;
  transition:opacity 220ms var(--ease);
}
.hero img.on{opacity:1;}

.detail-title{
  margin:0 0 5px;text-align:center;
  font-size:26px;font-weight:600;letter-spacing:-.02em;
}
.detail-sub{
  margin:0 0 20px;text-align:center;
  font-size:15px;color:var(--muted);
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--panel-radius);
  padding:17px 18px 18px;
  margin-bottom:14px;
  transition:background-color 300ms var(--ease),border-color 300ms var(--ease);
}
.panel-label{
  margin:0 0 14px;
  font-size:11.5px;font-weight:600;
  letter-spacing:.08em;
  color:var(--muted);
}

/* colour swatches */
.swatches{display:flex;gap:16px;padding:5px 5px 6px;flex-wrap:wrap;}
.swatch{
  width:34px;height:34px;border-radius:50%;
  background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);
  transition:box-shadow 180ms var(--ease);
}
.swatch[aria-pressed="true"]{
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4),
             0 0 0 3px var(--card),
             0 0 0 5px var(--accent);
}

/* storage */
.storage{display:flex;gap:10px;}
.store-btn{
  flex:1;height:44px;border-radius:12px;
  background:var(--chip);
  border:1px solid var(--chip-line);
  color:var(--text);
  font-size:14.5px;font-weight:500;
  transition:background-color 180ms var(--ease),color 180ms var(--ease),border-color 180ms var(--ease);
}
.store-btn[aria-pressed="true"]{
  background:var(--sel);color:var(--sel-ink);border-color:var(--sel);font-weight:600;
}

/* specs */
.spec{
  display:flex;justify-content:space-between;gap:18px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:14.5px;
}
.spec:last-child{border-bottom:0;padding-bottom:0;}
.spec:first-of-type{padding-top:0;}
.spec dt{color:var(--muted);flex:none;}
.spec dd{
  margin:0;text-align:right;
  min-width:0;overflow-wrap:anywhere;
}
.specs{margin:0;}

/* ============================================================
   THEME DOTS
   ============================================================ */
.themes{
  display:flex;justify-content:center;align-items:center;
  gap:6px;
  padding:30px 0 40px;
}
.theme-dot{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.theme-dot i{
  display:block;
  width:19px;height:19px;border-radius:50%;
  background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);
  transition:box-shadow 250ms var(--ease);
}
.theme-dot[aria-pressed="true"] i{
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4),
             0 0 0 2px var(--bg),
             0 0 0 4px var(--ring);
}

/* ============================================================
   VIEW TRANSITION + CONFETTI
   ============================================================ */
.view{animation:enter 260ms var(--ease) both;}
@keyframes enter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

#confetti{
  position:fixed;inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:60;
}

/* ============================================================
   LEARN MORE WINDOW
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.45);
  animation:fadeIn 180ms var(--ease) both;
}
.modal{
  width:100%;max-width:340px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--panel-radius);
  padding:24px 22px 20px;
  text-align:center;
  animation:pop 220ms var(--ease) both;
}
.modal h2{
  margin:0 0 4px;
  font-size:20px;font-weight:600;letter-spacing:-.01em;
}
.modal .modal-sub{
  margin:0 0 18px;
  font-size:14px;color:var(--muted);
}
.modal-rows{margin:0 0 20px;text-align:left;}
.modal-rows .spec{font-size:14.5px;}
.modal-actions{display:flex;flex-direction:column;gap:10px;}
.btn-quiet{
  height:44px;border-radius:12px;
  background:var(--chip);
  border:1px solid var(--chip-line);
  color:var(--text);
  font-size:15px;font-weight:500;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}

@media (max-width:370px){
  .media{height:230px;}
  .hero{height:180px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

function imgSrc(path){ return EMBEDDED[path] || path; }

/* ============================================================
   STATE
   ============================================================ */

const app = document.getElementById("app");

const state = {
  view: "catalog",
  modelId: null,
  colorId: null,
  storage: CONFIG.defaultStorage,
  theme: CONFIG.defaultTheme,
  catalogScroll: 0
};

const store = {
  get(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { window.localStorage.setItem(k,v); } catch(e){ /* file:// or blocked */ } }
};

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function findModel(id){ return CONFIG.models.find(m => m.id === id); }
function findColor(model, id){ return model.colors.find(c => c.id === id) || model.colors[0]; }
function specsFor(model){ return model.specs || CONFIG.defaultSpecs; }

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* ============================================================
   THEME
   ============================================================ */

function applyTheme(id){
  const theme = CONFIG.themes.find(t => t.id === id) ? id : CONFIG.defaultTheme;
  state.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  store.set("bgTheme", theme);
  document.querySelectorAll(".theme-dot").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.theme === theme));
  });
}

function themesMarkup(){
  return '<div class="themes" role="group" aria-label="Page background color">' +
    CONFIG.themes.map(t =>
      '<button type="button" class="theme-dot" data-theme="' + t.id + '"' +
      ' aria-pressed="' + (t.id === state.theme) + '"' +
      ' aria-label="Background ' + t.id + '">' +
      '<i style="--c:' + t.dot + '"></i></button>'
    ).join("") +
  '</div>';
}

/* ============================================================
   CATALOG
   ============================================================ */

function catalogEntries(){
  const out = [];
  CONFIG.models.forEach(model => {
    const ids = model.catalogColors && model.catalogColors.length
      ? model.catalogColors
      : [model.colors[0].id];
    ids.forEach(cid => {
      const color = model.colors.find(c => c.id === cid);
      if (color) out.push({ model, color });
    });
  });
  return out;
}

function renderCatalog(){
  const cards = catalogEntries().map(({ model, color }) => `
    <article class="card">
      ${model.badge ? `<span class="badge">${esc(model.badge)}</span>` : ""}
      <div class="media">
        <img src="${imgSrc(color.image)}" alt="${esc(model.name)} in ${esc(color.name)}" decoding="async">
      </div>
      <h2 class="model">${esc(model.name)}</h2>
      <p class="colorline"><span class="swatch-dot" style="--c:${color.dot}"></span>${esc(color.name)}</p>
      <button type="button" class="btn btn-primary" data-open="${model.id}" data-color="${color.id}">View Details</button>
    </article>`).join("");

  app.innerHTML = `
    <div class="view">
      <header class="brand">
        <img class="logo" src="${imgSrc(CONFIG.logo)}" alt="">
        <p class="lede">${esc(CONFIG.lede).replace(/\n/g, "<br>")}</p>
      </header>
      <section class="cards">${cards}</section>
      ${themesMarkup()}
    </div>`;
}

/* ============================================================
   DETAILS
   ============================================================ */

function renderDetails(){
  const model = findModel(state.modelId);
  const color = findColor(model, state.colorId);
  state.colorId = color.id;

  const swatches = model.colors.map(c =>
    `<button type="button" class="swatch" data-color="${c.id}" style="--c:${c.dot}"
       aria-pressed="${c.id === color.id}" aria-label="${esc(c.name)}"></button>`).join("");

  const storage = CONFIG.storageOptions.map(s =>
    `<button type="button" class="store-btn" data-storage="${esc(s)}"
       aria-pressed="${s === state.storage}">${esc(s)}</button>`).join("");

  const specs = specsFor(model).map(([k, v]) =>
    `<div class="spec"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");

  app.innerHTML = `
    <div class="view">
      <div class="detail-top">
        <button type="button" class="back" id="back" aria-label="Back to catalog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="hero" id="hero">
        <img id="heroA" class="on" src="${imgSrc(color.image)}" alt="${esc(model.name)} in ${esc(color.name)}" decoding="async">
        <img id="heroB" alt="" aria-hidden="true" decoding="async">
      </div>

      <h1 class="detail-title">${esc(model.name)}</h1>
      <p class="detail-sub" id="colorName">${esc(color.name)}</p>

      <section class="panel">
        <p class="panel-label">COLOR</p>
        <div class="swatches" role="group" aria-label="Color">${swatches}</div>
      </section>

      <section class="panel">
        <p class="panel-label">STORAGE</p>
        <div class="storage" role="group" aria-label="Storage">${storage}</div>
      </section>

      <section class="panel">
        <p class="panel-label">TECH SPECS</p>
        <dl class="specs">${specs}</dl>
      </section>

      <button type="button" class="btn btn-learn" id="learn">Learn More</button>

      ${themesMarkup()}
    </div>`;
}

/* Crossfade between two phone photos, image box stays the same size. */
let heroFront = "A";
function swapColor(colorId){
  const model = findModel(state.modelId);
  const color = findColor(model, colorId);
  if (color.id === state.colorId) return;
  state.colorId = color.id;

  const front = document.getElementById("hero" + heroFront);
  const back  = document.getElementById("hero" + (heroFront === "A" ? "B" : "A"));

  back.src = imgSrc(color.image);
  back.alt = model.name + " in " + color.name;
  back.removeAttribute("aria-hidden");
  front.setAttribute("aria-hidden", "true");
  front.alt = "";
  back.classList.add("on");
  front.classList.remove("on");
  heroFront = heroFront === "A" ? "B" : "A";

  document.getElementById("colorName").textContent = color.name;
  document.querySelectorAll(".swatch").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.color === color.id));
  });
  if (history.state && history.state.v === "details"){
    history.replaceState({ v:"details", m:state.modelId, c:color.id }, "");
  }
}

/* ============================================================
   NAVIGATION
   ============================================================ */

function showCatalog(restoreScroll){
  state.view = "catalog";
  renderCatalog();
  window.scrollTo(0, restoreScroll ? state.catalogScroll : 0);
}

function showDetails(modelId, colorId){
  state.view = "details";
  state.modelId = modelId;
  state.colorId = colorId;
  state.storage = CONFIG.defaultStorage;
  heroFront = "A";
  renderDetails();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open){
    state.catalogScroll = window.scrollY;
    history.pushState({ v:"details", m:open.dataset.open, c:open.dataset.color }, "");
    showDetails(open.dataset.open, open.dataset.color);
    return;
  }

  if (e.target.closest("#back")){ history.back(); return; }

  const sw = e.target.closest(".swatch");
  if (sw){ swapColor(sw.dataset.color); return; }

  const st = e.target.closest(".store-btn");
  if (st){
    state.storage = st.dataset.storage;
    document.querySelectorAll(".store-btn").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.storage === state.storage));
    });
    return;
  }

  const td = e.target.closest(".theme-dot");
  if (td){ applyTheme(td.dataset.theme); return; }

  if (e.target.closest("#learn")){ openWindow(); return; }

  if (e.target.closest("#modalClose") || e.target.id === "overlay"){ closeWindow(); }
});

/* ============================================================
   LEARN MORE WINDOW  →  then confetti
   ============================================================ */

let lastFocus = null;

function openWindow(){
  if (document.getElementById("overlay")) return;
  const model = findModel(state.modelId);
  const color = findColor(model, state.colorId);
  lastFocus = document.activeElement;

  const link = CONFIG.learnMoreUrl
    ? `<a class="btn btn-learn" style="margin-top:0;text-decoration:none"
          href="${esc(CONFIG.learnMoreUrl)}" target="_blank" rel="noopener">Open page</a>`
    : "";

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">${esc(model.name)}</h2>
      <p class="modal-sub">Your selection</p>
      <dl class="modal-rows">
        <div class="spec"><dt>Color</dt><dd>${esc(color.name)}</dd></div>
        <div class="spec"><dt>Storage</dt><dd>${esc(state.storage)}</dd></div>
      </dl>
      <div class="modal-actions">
        ${link}
        <button type="button" class="btn-quiet" id="modalClose">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("modalClose").focus();

  /* window first, confetti right after it lands */
  setTimeout(confetti, reducedMotion.matches ? 0 : 160);
}

function closeWindow(){
  const overlay = document.getElementById("overlay");
  if (!overlay) return;
  overlay.remove();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeWindow();
});

window.addEventListener("popstate", e => {
  const s = e.state;
  if (s && s.v === "details"){
    showDetails(s.m, s.c);
  } else {
    showCatalog(true);
  }
});

/* ============================================================
   CONFETTI — short, non-blocking, self-clearing
   ============================================================ */

function confetti(){
  if (reducedMotion.matches) return;
  const old = document.getElementById("confetti");
  if (old) old.remove();

  const canvas = document.createElement("canvas");
  canvas.id = "confetti";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const colors = ["#FF9500","#34C759","#FF3B30","#0A84FF","#FFD60A","#BF5AF2","#FF6482"];
  const origin = { x: w / 2, y: h * 0.72 };
  const bits = [];
  for (let i = 0; i < 70; i++){
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.0;
    const speed = 5 + Math.random() * 8;
    bits.push({
      x: origin.x + (Math.random() - 0.5) * 60,
      y: origin.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      w: 5 + Math.random() * 5,
      h: 8 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      color: colors[(Math.random() * colors.length) | 0]
    });
  }

  const start = performance.now();
  const LIFE = 1300;

  (function frame(now){
    const t = now - start;
    if (t > LIFE){ canvas.remove(); return; }
    ctx.clearRect(0, 0, w, h);
    ctx.globalAlpha = t > LIFE * 0.6 ? 1 - (t - LIFE * 0.6) / (LIFE * 0.4) : 1;
    bits.forEach(b => {
      b.vy += 0.3;
      b.vx *= 0.99;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });
    requestAnimationFrame(frame);
  })(start);
}

/* ============================================================
   BOOT
   ============================================================ */

applyTheme(store.get("bgTheme") || CONFIG.defaultTheme);
history.replaceState({ v:"catalog" }, "");
showCatalog(false);
applyTheme(state.theme);

/* Preload every photo so colour switching never flashes. */
CONFIG.models.forEach(m => m.colors.forEach(c => { new Image().src = imgSrc(c.image); }));
</script>
